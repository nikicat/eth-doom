[workspace]
resolver = "2"
members = ["map-extract", "harness", "client-core", "wl-extract"]

[workspace.package]
edition = "2021"
license = "MIT"

# Shared deps; members opt in via `<dep>.workspace = true`.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
