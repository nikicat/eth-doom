name: ci

on: [push, pull_request]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - run: forge test
        working-directory: contracts

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
      # harness's alloy::sol! macros embed contracts/out/*.json at compile time,
      # so the contracts must be built before `cargo test` will compile.
      - run: forge build
        working-directory: contracts
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: rust

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make
        working-directory: oracle
