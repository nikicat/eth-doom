[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
# NOTE: Engine is a whole game engine and sits just under EIP-170's 24,576-byte runtime
# limit (~24.57k). runs=200 is the gas-optimal setting that still fits; if a future change
# pushes it over, either lower runs (smaller code, more gas) or trim Engine.sol.
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# Allow tests/scripts to read committed map blobs and golden vectors, plus the
# extracted level.json (map-extract output) that Deploy.s.sol reads via MAP_JSON.
fs_permissions = [
    { access = "read", path = "../vectors" },
    { access = "read", path = "../oracle/maps" },
    { access = "read", path = "../web/public" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
