[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# Allow tests/scripts to read committed map blobs and golden vectors.
fs_permissions = [
    { access = "read", path = "../vectors" },
    { access = "read", path = "../oracle/maps" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
