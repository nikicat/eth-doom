[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
# NOTE: Engine is a whole game engine measured against EIP-170's 24,576-byte runtime limit.
# It runs ~23.7k (~0.9k headroom) after packing the enemy state graph into a byte table
# (GSTATES) and centralizing the per-obclass dispatch (_classInfo) — both big code savings
# made room for the enemy-death drops. runs=200 is gas-optimal; if a future change pushes it
# over, lower runs (smaller code, more gas) or give another big branch chain the same table
# treatment. via_ir makes `runs` nearly size-neutral, so trimming code is the real lever.
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# Allow tests/scripts to read committed map blobs and golden vectors, plus the
# extracted level.json (map-extract output) that Deploy.s.sol reads via MAP_JSON.
fs_permissions = [
    { access = "read", path = "../vectors" },
    { access = "read", path = "../oracle/maps" },
    { access = "read", path = "../web/public" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
